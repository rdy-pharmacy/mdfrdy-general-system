<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>READY YOUNG 명동 플래그쉽 인사관리 (미리보기)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --brand:#0e6b4f; --brand-dk:#0b5a43; --ink:#26241f; --sub:#8a877f;
  --bg:#f3f2ef; --card:#ffffff; --line:#e8e6e0; --line2:#efede8;
  --open-bg:#e2f1e2; --open-tx:#1f6b34; --mid-bg:#e1e9f8; --mid-tx:#2b57b0;
  --close-bg:#fbe6d8; --close-tx:#a04a1e; --pm-bg:#efe6f7; --pm-tx:#6a3ba8; --leave-bg:#fbdfe2; --leave-tx:#b3323f;
  --warn:#e8964a; --red:#c0392b; --green:#188a55; --gold:#8a6d1d; --gold-bg:#f6ecc9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
::placeholder{color:#b6b3ab}

/* ---------- topbar ---------- */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-in{max-width:1480px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{line-height:1.15}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--sub)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:#4c4a44}
.nav button:hover{background:#f1efe9}
.nav button.on{background:var(--brand);color:#fff}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold);font-weight:600}
.role-chip.admin{background:#dff0e6;color:var(--brand)}

/* ---------- layout ---------- */
.wrap{max-width:1480px;margin:0 auto;padding:26px 22px 90px}
.page-title{font-size:25px;font-weight:800;letter-spacing:-.3px}
.page-sub{color:var(--sub);font-size:13px;margin-top:3px}
.page-sub b{color:var(--red);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 1px 2px rgba(30,28,22,.03)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}.mt26{margin-top:26px}
.muted{color:var(--sub)}
.small{font-size:12px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-weight:600;color:#3d3b35}
.btn:hover{background:#faf9f6}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dk)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;font-weight:700}

/* ---------- badges ---------- */
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;vertical-align:middle}
.bg-open{background:var(--brand);color:#fff}
.bg-mid{background:#3b6fd4;color:#fff}
.bg-close{background:#b4532a;color:#fff}
.bg-pm{background:#7a4fb8;color:#fff}
.bg-shift{background:#6b6862;color:#fff}
.st-run{background:var(--brand);color:#fff}
.st-prep{background:#eceae4;color:#6b6862}
.st-done{background:#4c4a44;color:#fff}
.k-gift{background:#f3e6f7;color:#8e44ad}
.k-coupon{background:#fdeee0;color:#c66a1e}
.k-etc{background:#e9e7e1;color:#5c5a54}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#f0eee8;color:#5c5a54}
.tag.jp{background:#f8f0d8;color:#8a6d1d}
.tag.cn{background:#fbe4e4;color:#b3323f}
.tag.pharm{background:#e6eef8;color:#2b57b0}
.tag.mgr{background:#dce9f8;color:#1d4788;font-weight:700}
.tag.pt{background:#eef3fb;color:#5a7fc0}
.tag.log{background:#e7f0e7;color:#2f6b3a}
.tag.warn{background:var(--gold-bg);color:var(--gold)}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}

/* ---------- tabs / pills ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 16px;font-weight:700}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:13px}
.pills button.on{background:#26241f;border-color:#26241f;color:#fff}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{background:#faf9f6;border-bottom:1px solid var(--line);padding:9px 10px;font-weight:700;color:#57554f;text-align:left;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line2);padding:8px 10px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.holi td.daycell{color:var(--red);font-weight:700}
.tbl tr.wend td.daycell{background:#faf9f5}

/* attendance cell select */
select.cell{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12.5px;font-weight:600;background:#fff;min-width:86px}
select.cell.v-open{background:var(--open-bg);color:var(--open-tx);border-color:#cfe6cf}
select.cell.v-mid{background:var(--mid-bg);color:var(--mid-tx);border-color:#cbd8f0}
select.cell.v-close{background:var(--close-bg);color:var(--close-tx);border-color:#f2d5bd}
select.cell.v-pm{background:var(--pm-bg);color:var(--pm-tx);border-color:#ddc9f0}
select.cell.v-pmc{background:#f7d0bd;color:#8a3a12;border-color:#eebd9d}
select.cell.ew{border-style:dashed;border-width:1.5px}
select.cell.v-leave{background:var(--leave-bg);color:var(--leave-tx);border-color:#f2c3c8}
select.cell.chg{outline:2px solid var(--warn);outline-offset:1px}
.chip{display:inline-block;padding:1px 8px;border-radius:7px;font-size:12px;font-weight:600;margin:1.5px 2px;white-space:nowrap;background:#f0eee8;color:#4c4a44}
.chip.v-open{background:var(--open-bg);color:var(--open-tx)}
.chip.v-pm{background:var(--pm-bg);color:var(--pm-tx)}
.chip.v-mid{background:var(--mid-bg);color:var(--mid-tx)}
.chip.v-close{background:var(--close-bg);color:var(--close-tx)}
.chip.v-pmc{background:#f7d0bd;color:#8a3a12;font-weight:700}
.chip.v-leave{background:var(--leave-bg);color:var(--leave-tx)}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
input.remark{border:1px solid transparent;border-radius:7px;padding:4px 8px;width:100%;min-width:180px;background:transparent;font-size:12.5px}
input.remark:hover{border-color:var(--line)}
input.remark:focus{border-color:var(--brand);outline:0;background:#fff}

/* ---------- schedule grid ---------- */
.gridwrap{overflow-x:auto}
table.sched{border-collapse:collapse;font-size:11px}
.sched th,.sched td{border:1px solid var(--line2);padding:0;text-align:center}
.sched th.day{background:#faf9f6;font-weight:700;padding:5px 4px}
.sched th.emp{background:#fff;font-weight:600;color:#6b6862;padding:4px 2px;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:1px;font-size:10.5px;min-width:22px}
.sched td.hr{background:#faf9f6;font-weight:600;color:#6b6862;padding:3px 8px;white-space:nowrap}
.sched td.slot{width:24px;height:24px}
.dot{width:14px;height:14px;border-radius:50%;margin:0 auto}
.dot.rest{background:#26241f!important}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
.shiftline{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)}
.shiftline:last-child{border-bottom:0}
.notice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:8px}
.ncard{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff}
.ncard h4{font-size:13px;margin:5px 0 4px;line-height:1.35}
.ncard .desc{font-size:12px;color:#57554f;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden}
.ncard .until{float:right;font-size:11px;color:var(--sub)}
.todo-item{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line2)}
.todo-item:last-child{border-bottom:0}
.todo-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.todo-item span{flex:1;word-break:break-all}
.todo-item span.done{color:#b6b3ab;text-decoration:line-through}

/* ---------- notices page ---------- */
.notice-full{border:1px solid var(--line);border-radius:13px;background:#fff;padding:15px 17px;margin-top:12px}
.notice-full .desc{white-space:pre-wrap;color:#3d3b35;margin-top:7px;font-size:13.5px;word-break:break-word}
.nimgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px}
.nimgs img{max-height:190px;border-radius:9px;border:1px solid var(--line)}

/* ---------- login ---------- */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:38px 34px;width:360px;box-shadow:0 8px 30px rgba(30,28,22,.06)}
.login-card .logo{font-weight:800;color:var(--brand);font-size:14px}
.login-card h1{font-size:24px;font-weight:800;margin:6px 0 4px}
.login-card p{color:var(--sub);font-size:13px;margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:700;color:#57554f;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand)}
.field{margin-bottom:13px}
.login-err{color:var(--red);font-size:12.5px;margin-top:9px;display:none}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(25,23,18,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:46px 16px;overflow:auto}
.modal{background:#fff;border-radius:15px;padding:24px;width:100%;max-width:560px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal.wide{max-width:760px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---------- footer / misc ---------- */
.previewpill{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:#26241f;color:#dcd9d2;
  font-size:12px;padding:7px 16px;border-radius:999px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--sub);background:#fcfbf9}
.hidden{display:none!important}
.verchip{border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff;text-align:left;cursor:pointer}
.verchip b{display:block;font-size:14px}
.verchip small{color:var(--sub)}
.verchip.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.verchip .live{color:var(--brand);font-weight:700}
@media print{.topbar,.previewpill{display:none}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login" class="login-screen hidden">
  <div class="login-card">
    <div class="logo">명동 플래그쉽 레디영약국</div>
    <h1>인사관리</h1>
    <p>비밀번호를 입력해 로그인하세요.</p>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPw" autocomplete="current-password" placeholder="">
    </div>
    <button class="btn primary" style="width:100%;padding:10px" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand"><b>명동 플래그쉽 레디영</b><span>인사관리</span></div>
      <nav class="nav" id="mainNav">
        <button data-p="dash">대시보드</button>
        <button data-p="attend">출근부</button>
        <button data-p="pattern">근무표</button>
        <button data-p="leave">연차·휴가</button>
        <button data-p="staff">직원</button>
        <button data-p="notice">공지·이벤트</button>
      </nav>
      <div class="top-right">
        <span class="role-chip" id="roleChip"></span>
        <button class="btn sm" onclick="openBackup()">백업</button>
        <button class="btn sm" onclick="doLogout()">로그아웃</button>
      </div>
    </div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<div id="modalRoot"></div>
<div class="previewpill">미리보기 · 데이터는 이 브라우저에만 저장됩니다</div>

let DB = null;
function freshDB(){
  return { employees:[], patterns:[{id:uid(),name:"기본",effective:"2026-08-01",assign:{}}],
    shifts:DEFAULT_SHIFTS(), shiftsV5:true, attendance:{}, leaves:[], adjustments:[], todos:[], notices:[] };

function load(){
  try{ DB = JSON.parse(localStorage.getItem(DB_KEY)) || freshDB(); }
  catch(e){ DB = freshDB(); }
  if(!DB.shifts) DB.shifts = DEFAULT_SHIFTS();
  if(!DB.shiftsV5){ DB.shifts = DEFAULT_SHIFTS(); DB.shiftsV5 = true; }  // 휴게 제거·격주 반영
  if(!DB.shifts["물류"]) DB.shifts["물류"]=DEFAULT_SHIFTS()["물류"];
  if(!DB.seedV2){
    const p=DB.patterns[0];
    if(DB.employees.length===0){ p.name="9월-1"; p.effective="2026-09-01"; }
    const addTeam=(key,emps,assign)=>{           // 해당 팀 직원이 하나도 없을 때만 시드
      if(DB.employees.some(e=>JOB_OF(e)===key)) return;
      DB.employees.push(...JSON.parse(JSON.stringify(emps)));
      p.assign[key]=JSON.parse(JSON.stringify(assign));
    };
    addTeam("약사",SEED_EMPLOYEES,SEED_PATTERN);
    addTeam("일본",SEED_EMP_JP,SEED_PAT_JP);
    addTeam("중국",SEED_EMP_CN,SEED_PAT_CN);
    DB.seedV1=true; DB.seedV2=true; save();
  }
  if(!DB.biV1){   // 격주 도입: 기존 시드의 약사 격주 파트 6명 전환
    const bi={pt1:[5,"W13|close"],pt2:[5,"W24|close"],pt3:[6,"W13|open"],pt4:[6,"W24|open"],pt5:[6,"W41|mid"],pt6:[6,"W23|mid"]};
    DB.patterns.forEach(pt=>{ const a=pt.assign?.["약사"]; if(!a) return;
      for(const id in bi){ const[wd,v]=bi[id]; if(a[id] && typeof a[id][wd]==="string" && !a[id][wd].includes("|")) a[id][wd]=v; } });
    DB.biV1=true; save();
  }
  if(!DB.calV1){  // 파트약사 캘린더(260830) 반영: A/B → 주차 표기, 순환·첫 근무일 갱신
    DB.patterns.forEach(pt=>{ for(const j in pt.assign||{}) for(const id in pt.assign[j]) for(const wd in pt.assign[j][id]){
      const v=pt.assign[j][id][wd];
      if(typeof v==="string"){
        if(v.startsWith("A|")) pt.assign[j][id][wd]="W13|"+v.slice(2);
        else if(v.startsWith("B|")) pt.assign[j][id][wd]="W24|"+v.slice(2);
      } } });
    const fix={pt5:[6,"W41|mid"],pt6:[6,"W23|mid"]};
    DB.patterns.forEach(pt=>{ const a=pt.assign?.["약사"]; if(!a) return;
      for(const id in fix){ const[wd,v]=fix[id]; if(a[id]) a[id][wd]=v; } });
    const jd={pt1:"2026-09-19",pt2:"2026-09-12",pt3:"2026-09-20",pt4:"2026-09-13",
              pt5:"2026-09-27",pt6:"2026-09-13",pt7:"2026-09-12",pt8:"2026-09-13"};
    DB.employees.forEach(e=>{ if(jd[e.id] && e.joinDate==="2026-09-01") e.joinDate=jd[e.id]; });
    DB.calV1=true; save();
  }
  if(!DB.jobV1){  // 직무 6분류 전환
    const mgr={p01:1,p02:1};
    DB.employees.forEach(e=>{
      if(e.job==="약무") e.job = mgr[e.id] ? "관리약사" : (e.emp==="파트" ? "파트약사" : "정규약사");

function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function dateStr(ym,d){ return `${ym}-${pad(d)}`; }
function dowOf(ds){ return new Date(ds+"T00:00:00").getDay(); }               // 0=일
function wdIdx(ds){ return (dowOf(ds)+6)%7; }                                  // 0=월 … 6=일
function shiftYM(ym,delta){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+delta,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function fmtYMK(ym){ const [y,m]=ym.split("-"); return `${y}년 ${Number(m)}월`; }
function monthsBetween(a,b){ // 만 개월수 (a 입사일 → b 기준일)
  const A=new Date(a+"T00:00:00"), B=new Date(b+"T00:00:00");
  let m=(B.getFullYear()-A.getFullYear())*12+(B.getMonth()-A.getMonth());
  if(B.getDate() < A.getDate()) m--;
  return Math.max(0,m);
}
function toH(t){ const [h,m]=t.split(":").map(Number); return h+m/60; }
function num(v){ return Math.round(v*10)/10; }

/* 재직 판단 */
function activeInMonth(e,ym){
  const first=ym+"-01", last=dateStr(ym,daysInMonth(ym));
  if(e.joinDate > last) return false;
  if(e.leaveDate && e.leaveDate < first) return false;
  return true;
}
function activeOnDate(e,ds){
  if(e.joinDate > ds) return false;
  if(e.leaveDate && e.leaveDate < ds) return false;
  return true;
}
function jobEmployees(job,ym){
  return DB.employees.filter(e=>JOB_OF(e)===job && (!ym || activeInMonth(e,ym)))
    .sort((a,b)=>String(a.no).localeCompare(String(b.no)));
}
function empById(id){ return DB.employees.find(e=>e.id===id); }
function shiftsOf(job){ return DB.shifts[job] || []; }
function shiftDef(job,k){ return shiftsOf(job).find(s=>s.k===k); }

/* 적용 중인 정규 근무표 버전 */
function patternForDate(ds){
  const list = DB.patterns.filter(p=>p.effective<=ds).sort((a,b)=>a.effective.localeCompare(b.effective));
  if(list.length) return list[list.length-1];
  const all=[...DB.patterns].sort((a,b)=>a.effective.localeCompare(b.effective));
  return all[0]||null;   // 시행일 이전이면 가장 이른 버전 적용
}
function patternValue(pat,job,empId,wd){
  if(!pat||!pat.assign||!pat.assign[job]||!pat.assign[job][empId]) return "";
  return pat.assign[job][empId][wd] ?? "";
}
/* 4주 순환: 2026-08-31(월)이 속한 주 = 1주차, 이후 2→3→4→1 반복
   격주는 1·3주차 / 2·4주차, 2주씩 교대는 2·3주차 / 4·1주차로 표현 */
const CYCLE_ANCHOR = new Date("2026-08-31T00:00:00");
const CYCLES = [["13","1·3주차"],["24","2·4주차"],["23","2·3주차"],["41","4·1주차"]];
function weekNum(ds){
  const dd=Math.floor((new Date(ds+"T00:00:00")-CYCLE_ANCHOR)/604800000);
  return ((dd%4)+4)%4+1;
}
function isBi(v){ return typeof v==="string" && v.includes("|"); }
function resolvePV(pat,job,empId,ds){   // 정규표 값을 실제 날짜 기준으로 해석 (순환 주차 반영)
  const v=patternValue(pat,job,empId,wdIdx(ds));
  if(isBi(v)){ const[ph,k]=v.split("|");
    return ph.replace("W","").includes(String(weekNum(ds))) ? k : ""; }
  return v;
}
function cellLabel(job,v){
  if(!v) return "–";
  if(isBi(v)){ const[ph,k]=v.split("|"); const d=shiftDef(job,k); return `${ph.replace("W","").split("").join("·")}주차·${d?d.label:k}`; }
  if(v==="leave") return "연차";
  if(typeof v==="object") return `${v.s}~${v.e}`;
  const d=shiftDef(job,v); return d? d.label : "–";
}
function cellClass(v){
  if(!v) return "";
  if(isBi(v)) return cellClass(v.split("|")[1])+" ew";
  if(v==="leave") return "v-leave";
  if(typeof v==="object") return "v-mid";
  return (v==="open"||v==="open2")?"v-open":(v==="pm"||v==="pm2")?"v-pm":v==="mid"?"v-mid":v==="pmclose"?"v-pmc":"v-close";
}
function sameVal(a,b){
  if(typeof a==="object"||typeof b==="object") return JSON.stringify(a||"")===JSON.stringify(b||"");
  return (a||"")===(b||"");
}

function todayCellValue(e){
  const ds=todayStr(), ym=ymOf(ds), job=JOB_OF(e);
  const day=Number(ds.slice(8));
  const cells=DB.attendance[ym]?.[job]?.cells?.[e.id];
  if(cells && cells[day]!==undefined && cells[day]!==null) return cells[day];
  return resolvePV(patternForDate(ds),job,e.id,ds);   // 출근부 미입력 시 정규표 기준(격주 반영)
}
function rDash(){
  const ds=todayStr();
  /* 오늘의 근무: 근무 라벨별 그룹 */
  const groups={};   // label -> {cls, names[]}
  DB.employees.filter(e=>activeOnDate(e,ds)).forEach(e=>{
    const v=todayCellValue(e); if(!v||v==="leave") return;
    const job=JOB_OF(e);
    let label,cls;
    if(typeof v==="object"){ label=`${v.s}~${v.e}`; cls="bg-shift"; }
    else{ const d=shiftDef(job,v); if(!d) return; label=d.label;
      cls=(v==="open"||v==="open2")?"bg-open":(v==="pm"||v==="pm2")?"bg-pm":v==="mid"?"bg-mid":(v==="close"||v==="pmclose")?"bg-close":"bg-shift"; }
    (groups[label] ||= {cls,names:[]}).names.push(e.name);
  });
  const order=[...new Set(JOBS.flatMap(j=>shiftsOf(j).map(x=>x.label)))];
  const keys=Object.keys(groups).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
  const shiftHtml = keys.length ? keys.map(k=>
    `<div class="shiftline"><span class="badge ${groups[k].cls}">${esc(k)}</span><div>${groups[k].names.map(esc).join(", ")}</div></div>`
  ).join("") : `<div class="muted small">오늘 근무 배정이 없습니다. 출근부 또는 근무표를 입력해 주세요.</div>`;

  /* 할 일 */
  const undone=DB.todos.filter(t=>!t.done).length;
  const todos=DB.todos.map(t=>
    `<div class="todo-item">
      <input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${t.id}')">
      <span class="${t.done?"done":""}">${esc(t.text)}</span>
      <button class="btn sm" onclick="delTodo('${t.id}')">삭제</button>
    </div>`).join("");

  /* 공지·이벤트 (진행중) */
  const run=DB.notices.filter(n=>n.status==="진행중");
  const kinds=["증정","쿠폰","기타"];
  const noticeHtml=kinds.map(k=>{
    const list=run.filter(n=>n.kind===k);
    if(!list.length) return "";
    return `<div class="mt14"><span class="tag ${k==="증정"?"k-gift":k==="쿠폰"?"k-coupon":"k-etc"}" style="font-weight:700">${k}</span>
      <span class="muted small" style="margin-left:6px">${list.length}건</span>
      <div class="notice-grid">${list.map(n=>`
        <div class="ncard">
          <span class="until">${n.always?"상시":esc("~ "+(n.end||""))}</span>
          <span class="badge st-run">진행중</span>
          <h4>${esc(n.title)}</h4>
          <div class="desc">${esc(n.body)}</div>
        </div>`).join("")}</div></div>`;
  }).join("") || `<div class="empty mt14">진행 중인 공지·이벤트가 없습니다.</div>`;

  return `
  <h1 class="page-title">대시보드</h1>
  <div class="page-sub">${ds} (${DOW[dowOf(ds)]})${HOLIDAYS[ds]?` · <span style="color:var(--red)">${HOLIDAYS[ds]}</span>`:""}</div>
  <div class="dash mt20">
    <div>
      <div class="card">
        <b>오늘의 근무</b>
        <div class="mt8">${shiftHtml}</div>
      </div>
      <div class="card mt14">
        <b>할 일</b> <span class="muted small">· 미완료 ${undone}</span>
        <div class="row mt8" style="gap:8px">
          <input class="grow" id="todoIn" placeholder="" style="border:1px solid var(--line);border-radius:9px;padding:8px 11px"
                 onkeydown="if(event.key==='Enter')addTodo()">
          <button class="btn primary" onclick="addTodo()">추가</button>
        </div>
        <div class="mt8">${todos||'<div class="muted small" style="padding:6px 2px">등록된 할 일이 없습니다.</div>'}</div>
      </div>
    </div>
    <div class="card">
      <b>공지·이벤트</b>
      ${noticeHtml}
    </div>
  </div>`;
}
function addTodo(){ const v=$("#todoIn").value.trim(); if(!v) return; DB.todos.push({id:uid(),text:v,done:false}); save(); render(); }
function toggleTodo(id){ const t=DB.todos.find(x=>x.id===id); if(t){t.done=!t.done; save(); render();} }
function delTodo(id){ DB.todos=DB.todos.filter(x=>x.id!==id); save(); render(); }

================================================================ */
function attMonth(ym,job){
  DB.attendance[ym] ||= {};
  DB.attendance[ym][job] ||= {cells:{},remarks:{}};
  return DB.attendance[ym][job];
}
function rAttend(){
  const ym=S.attendYM;
  if(S.attendView===undefined) S.attendView="sum";
  const sum=S.attendView==="sum";
  if(!sum && S.attendJob==="전체") S.attendJob="약사";
  const job=S.attendJob;
  const n=daysInMonth(ym);

  const head=`
  <h1 class="page-title">출근부</h1>
  <div class="page-sub">${sum
    ? "날짜별 근무 인원 요약 · 출근부 미입력 칸은 정규 근무표(격주·순환 반영) 기준으로 표시됩니다"
    : "정규 근무표 + 변경사항 반영한 실제 근무표 · <b>변경사항은 자동 저장됩니다</b> (정규표와 다른 칸은 주황 테두리 · 격주·순환 배정은 해당 주차만 채워짐 · 이번 주 ${weekNum(todayStr())}주차)"}</div>
  <div class="row mt14">
    <button class="iconbtn" onclick="S.attendYM=shiftYM(S.attendYM,-1);render()">◀</button>
    <b style="font-size:17px">${fmtYMK(ym)}</b>
    <button class="iconbtn" onclick="S.attendYM=shiftYM(S.attendYM,1);render()">▶</button>
    <div class="tabs" style="margin-left:4px">
      <button class="${sum?"on":""}" onclick="S.attendView='sum';render()">한눈에 보기</button>
      <button class="${sum?"":"on"}" onclick="S.attendView='edit';render()">편집</button>
    </div>
    ${sum?"":`<button class="btn" onclick="attFill()">정규 근무표로 채우기</button>
    <button class="btn" onclick="attClear()">이 달 비우기</button>`}
  </div>`;

  /* ---------- 한눈에 보기 ---------- */
  if(sum){
    const jobs = job==="전체" ? JOBS : [job];
    const dotColor={ "약사":"#2b57b0","일본":"#c9a227","중국":"#d4636f","물류":"#3f8a4f" };
    const chipCls=v=>{
      if(v==="leave") return "v-leave";
      if(typeof v==="object") return "v-mid";
      return (v==="open"||v==="open2")?"v-open":(v==="pm"||v==="pm2")?"v-pm":v==="mid"?"v-mid":v==="pmclose"?"v-pmc":"v-close";
    };
    const bucketOf=(j,v)=>{
      if(v==="leave") return "연차";
      if(typeof v==="object"){ const h=toH(v.s); return h<12?"오픈":h<16?"오후":"마감"; }
      if(v==="open"||v==="open2") return "오픈";
      if(v==="pm"||v==="pm2") return "오후";
      if(v==="mid") return "중간";
      return "마감";
    };
    const BUCKETS=["오픈","오후","중간","마감","연차"];
    const rows=[];
    for(let d=1;d<=n;d++){
      const ds=dateStr(ym,d), dow=dowOf(ds), holi=HOLIDAYS[ds];
      const by={ "오픈":[], "오후":[], "중간":[], "마감":[], "연차":[] };
      let workCnt=0;
      jobs.forEach(j=>{
        jobEmployees(j,ym).forEach(e=>{
          if(!activeOnDate(e,ds)) return;
          const cells=DB.attendance[ym]?.[j]?.cells?.[e.id];
          let v=cells?.[d];
          if(v===undefined) v=resolvePV(patternForDate(ds),j,e.id,ds);
          if(!v) return;
          if(v!=="leave") workCnt++;
          by[bucketOf(j,v)].push(
            `<span class="chip ${chipCls(v)}">${job==="전체"?`<i class="tdot" style="background:${dotColor[j]}"></i>`:""}${esc(e.name)}${typeof v==="object"?` ${v.s}~${v.e}`:""}${v==="pmclose"?" ★":""}</span>`);
        });
      });
      const remarks=jobs.map(j=>{
        const r=DB.attendance[ym]?.[j]?.remarks?.[d];
        return r? (job==="전체"?`<span class="tag" style="margin-right:3px">${j}</span>${esc(r)}`:esc(r)) : "";
      }).filter(Boolean).join("<br>");
      rows.push(`<tr class="${holi||dow===0?"holi":""}${dow===6?" wend":""}">
        <td class="c daycell" style="white-space:nowrap">${d}일 ${holi?"●":""}</td>
        <td class="c daycell" style="color:${dow===0||holi?"var(--red)":dow===6?"#2b57b0":"inherit"}">${DOW[dow]}</td>
        ${BUCKETS.map(bk=>`<td>${by[bk].join("")}</td>`).join("")}
        <td class="c"><b>${workCnt||"–"}</b></td>
        <td class="small" style="color:#57554f">${remarks}</td>
      </tr>`);
    }
    return head+`
    <div class="row mt14">
      <div class="tabs">${["전체",...JOBS].map(j=>`<button class="${j===job?"on":""}" onclick="S.attendJob='${j}';render()">${j}</button>`).join("")}</div>
      <div class="legend" style="margin-left:6px">
        <span><i style="background:var(--open-bg)"></i>오픈</span>
        <span><i style="background:var(--pm-bg)"></i>오후</span>
        <span><i style="background:var(--mid-bg)"></i>중간</span>
        <span><i style="background:var(--close-bg)"></i>마감</span>
        <span>★ 마감 담당(~24:30)</span>
        <span><i style="background:var(--leave-bg)"></i>연차</span>
        ${job==="전체"?JOBS.map(j=>`<span><i class="tdot" style="background:${dotColor[j]};border-radius:50%"></i>${j}</span>`).join(""):""}
      </div>
    </div>
    <div class="tblwrap mt14">
      <table class="tbl">
        <thead><tr><th class="c">날짜</th><th class="c">요일</th>
          <th style="min-width:150px">오픈</th><th style="min-width:150px">오후</th>
          <th style="min-width:110px">중간</th><th style="min-width:150px">마감</th>
          <th style="min-width:90px">연차</th><th class="c">계</th><th style="min-width:140px">비고</th></tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>`;
  }

  /* ---------- 편집 보기 ---------- */
  const emps=jobEmployees(job,ym);
  const m=attMonth(ym,job);
  const sdefs=shiftsOf(job);
  const rows=[];
  for(let d=1;d<=n;d++){
    const ds=dateStr(ym,d), dow=dowOf(ds), holi=HOLIDAYS[ds];
    const pat=patternForDate(ds);
    const tds=emps.map(e=>{
      if(!activeOnDate(e,ds)) return `<td class="c" style="background:#faf9f5"></td>`;
      const cur = m.cells[e.id]?.[d] ?? "";
      const pv  = resolvePV(pat,job,e.id,ds);
      const chg = !sameVal(cur,pv) ? " chg":"";
      const isObj = typeof cur==="object";
      const opts = [`<option value="">–</option>`]
        .concat(sdefs.map(s=>`<option value="${s.k}" ${cur===s.k?"selected":""}>${esc(s.label)}(${s.s})</option>`))
        .concat([`<option value="leave" ${cur==="leave"?"selected":""}>연차</option>`]);
      if(isObj) opts.push(`<option value="__cur" selected>${cur.s}~${cur.e}</option>`);
      opts.push(`<option value="__time">시간입력…</option>`);
      return `<td class="c"><select class="cell ${cellClass(cur)}${chg}" onchange="attSet('${e.id}',${d},this)">${opts.join("")}</select></td>`;
    }).join("");
    rows.push(`<tr class="${holi||dow===0?"holi":""}${dow===6?" wend":""}">
      <td class="c daycell" style="white-space:nowrap">${d}일 ${holi?"●":""}</td>
      <td class="c daycell" style="color:${dow===0||holi?"var(--red)":dow===6?"#2b57b0":"inherit"}">${DOW[dow]}</td>
      ${tds}
      <td><input class="remark" value="${esc(m.remarks[d]||"")}" onchange="attRemark(${d},this.value)"></td>
    </tr>`);
  }
  return head+`
  <div class="row mt14">
    <div class="tabs">${JOBS.map(j=>`<button class="${j===job?"on":""}" onclick="S.attendJob='${j}';render()">${j}</button>`).join("")}</div>
    <div class="legend" style="margin-left:6px">
      ${sdefs.map(x=>`<span><i style="background:var(--${(x.k==="open"||x.k==="open2")?"open":(x.k==="pm"||x.k==="pm2")?"pm":x.k==="mid"?"mid":"close"}-bg)"></i>${esc(x.label)}</span>`).join("")}
      <span><i style="background:var(--leave-bg)"></i>연차</span>
      <span>– 휴무</span>
    </div>
  </div>
  ${emps.length? `
  <div class="tblwrap mt14">
    <table class="tbl">
      <thead><tr><th class="c">날짜</th><th class="c">요일</th>${emps.map(e=>`<th class="c">${esc(e.name)}</th>`).join("")}<th>비고</th></tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>
  </div>`
  : `<div class="empty mt14">이 달에 재직 중인 <b>${job}</b> 직원이 없습니다. 먼저 <a href="#" onclick="go('staff');return false">직원</a> 메뉴에서 입사 등록을 해주세요.</div>`}
  `;
}
function attSet(empId,day,sel){
  const m=attMonth(S.attendYM,S.attendJob);
  let v=sel.value;
  if(v==="__cur") return;
  if(v==="__time"){
    const prev=m.cells[empId]?.[day];
    const cur=(typeof prev==="object")?prev:{s:"10:00",e:"19:00"};
    const s=prompt("시작 시간 (HH:MM)",cur.s); if(s===null){render();return;}
    const e=prompt("종료 시간 (HH:MM)",cur.e); if(e===null){render();return;}
    v={s:s.trim(),e:e.trim()};
  }
  m.cells[empId] ||= {};
  if(v==="") delete m.cells[empId][day]; else m.cells[empId][day]=v;
  save(); render();
}
function attRemark(day,val){
  const m=attMonth(S.attendYM,S.attendJob);
  if(val.trim()==="") delete m.remarks[day]; else m.remarks[day]=val;
  save();
}
function attFill(){
  if(!confirm("이 달 "+S.attendJob+" 출근부를 정규 근무표 기준으로 덮어쓸까요?\n(직접 수정한 칸도 정규표 값으로 바뀝니다)")) return;
  const ym=S.attendYM, job=S.attendJob, m=attMonth(ym,job), n=daysInMonth(ym);
  jobEmployees(job,ym).forEach(e=>{
    m.cells[e.id]={};
    for(let d=1;d<=n;d++){
      const ds=dateStr(ym,d); if(!activeOnDate(e,ds)) continue;
      const pv=resolvePV(patternForDate(ds),job,e.id,ds);
      if(pv) m.cells[e.id][d]=pv;
    }
  });
  save(); render();
}
function attClear(){
  if(!confirm("이 달 "+S.attendJob+" 출근부를 모두 비울까요?")) return;
  DB.attendance[S.attendYM][S.attendJob]={cells:{},remarks:{}}; save(); render();
}

   정규 근무표
================================================================ */
function curPattern(){
  let p = DB.patterns.find(x=>x.id===S.patId);
  if(!p){ p = patternForDate(todayStr()) || DB.patterns[DB.patterns.length-1]; S.patId=p.id; }
  return p;
}
function rPattern(){
  const job=S.patJob, pat=curPattern();
  const emps=jobEmployees(job).filter(e=>!e.leaveDate || e.leaveDate>=pat.effective);
  const sdefs=shiftsOf(job);
  const live = patternForDate(todayStr());

  /* 버전 칩 */
  const vers=[...DB.patterns].sort((a,b)=>a.effective.localeCompare(b.effective));
  const chips=vers.map(p=>`
    <button class="verchip ${p.id===pat.id?"on":""}" onclick="S.patId='${p.id}';render()">
      <b>${esc(p.name)}</b><small>${p.effective}부터 ${live&&live.id===p.id?'· <span class="live">● 현재 시행중</span>':""}</small>
    </button>`).join("");

  /* 주간 시간표 그리드 */
  const colorOf={}; emps.forEach((e,i)=>colorOf[e.id]=EMP_COLORS[i%EMP_COLORS.length]);
  function slotOf(empId,wd){
    let v=patternValue(pat,job,empId,wd), bi=false;
    if(isBi(v)){ bi=true; v=v.split("|")[1]; }
    if(!v||v==="leave") return null;
    if(typeof v==="object") return {s:toH(v.s),e:toH(v.e),b:(v.b??null),bi};
    const d=shiftDef(job,v); return d?{s:toH(d.s),e:toH(d.e),b:d.b,bi}:null;
  }
  let grid="";
  if(emps.length){
    const head1=`<tr><th class="day" rowspan="2" style="min-width:56px">시간</th>${
      ["월","화","수","목","금","토","일"].map(d=>`<th class="day" colspan="${emps.length}">${d}</th>`).join("")}</tr>`;
    const head2=`<tr>${[0,1,2,3,4,5,6].map(()=>emps.map(e=>`<th class="emp">${esc(e.name)}</th>`).join("")).join("")}</tr>`;
    let body="";
    const _hr=sdefs.flatMap(x=>[toH(x.s),toH(x.e)]);
    const _lo=Math.floor(Math.min(10,..._hr)), _hi=Math.ceil(Math.max(24,..._hr));
    for(let h=_lo;h<_hi;h++){
      body+=`<tr><td class="hr">${h}~${h+1}</td>`;
      for(let wd=0;wd<7;wd++) for(const e of emps){
        const sl=slotOf(e.id,wd);
        const on = sl && (h+1)>sl.s && h<sl.e;
        const rest = on && sl.b!==null && h===sl.b;
        body+=`<td class="slot">${on?`<div class="dot ${rest?"rest":""}" style="background:${colorOf[e.id]}${sl.bi?";opacity:.4":""}"></div>`:""}</td>`;
      }
      body+="</tr>";
    }
    grid=`<div class="gridwrap"><table class="sched">${head1}${head2}${body}</table></div>`;
  } else grid=`<div class="empty">재직 중인 ${job} 직원이 없습니다.</div>`;

  /* 배정 편집 표 */
  const editRows=emps.map(e=>{
    const cells=[0,1,2,3,4,5,6].map(wd=>{
      const v=patternValue(pat,job,e.id,wd);
      const isObj=typeof v==="object";
      const opts=[`<option value="">–</option>`]
        .concat(sdefs.map(x=>`<option value="${x.k}" ${v===x.k?"selected":""}>${esc(x.label)}</option>`))
        .concat(CYCLES.map(([c,lb])=>
          `<optgroup label="── ${lb}만 근무">`+sdefs.map(x=>`<option value="W${c}|${x.k}" ${v==="W"+c+"|"+x.k?"selected":""}>${lb}·${esc(x.label)}</option>`).join("")+`</optgroup>`).join(""));
      if(isObj) opts.push(`<option value="__cur" selected>${v.s}~${v.e}</option>`);
      opts.push(`<option value="__time">시간입력…</option>`);
      return `<td class="c"><select class="cell ${cellClass(v)}" onchange="patSet('${e.id}',${wd},this)">${opts.join("")}</select></td>`;
    }).join("");
    return `<tr><td><b>${esc(e.name)}</b> ${e.emp==="파트"?'<span class="muted small">파트</span>':""}</td>${cells}</tr>`;
  }).join("");

  const hasRest=sdefs.some(x=>x.b!==null);
  const hasBi=Object.values(pat.assign?.[job]||{}).some(o=>Object.values(o).some(isBi));
  const legend=emps.map(e=>`<span><i style="background:${colorOf[e.id]};border-radius:50%"></i>${esc(e.name)}</span>`).join("")
    +(hasRest?`<span><i style="background:#26241f;border-radius:50%"></i>휴게</span>`:"")
    +(hasBi?`<span><i style="background:#b6b3ab;border-radius:50%;opacity:.5"></i>반투명 = 격주·순환 근무</span>`:"");

  return `
  <div class="row" style="justify-content:space-between">
    <div>
      <h1 class="page-title">정규 근무표</h1>
      <div class="page-sub">직무별 정규 시간표 · 실제 출근은 출근부에서 확인(변경사항 포함) · <b>변경사항은 자동 저장됩니다</b> · 이번 주는 <b>순환 ${weekNum(todayStr())}주차</b></div>
    </div>
    <button class="btn primary" onclick="patNew()">＋ 새 버전</button>
  </div>
  <div class="row mt14">${chips}
    <button class="btn" onclick="patRename()">✎ 시행일·이름</button>
    ${DB.patterns.length>1?`<button class="btn danger" onclick="patDelete()">삭제</button>`:""}
  </div>
  <div class="row mt14">
    <div class="tabs">${JOBS.map(j=>`<button class="${j===job?"on":""}" onclick="S.patJob='${j}';render()">${j}</button>`).join("")}</div>
    <button class="btn sm" onclick="openShiftSettings()">근무시간 설정</button>
  </div>
  <div class="legend mt8">${legend}</div>
  <div class="card mt14">${grid}</div>
  <h2 class="mt26" style="font-size:18px;font-weight:800">${job} 배정 편집</h2>
  <div class="page-sub">칸을 바꾸면 위 시간표에 바로 반영돼요 (${esc(pat.name)} · ${pat.effective}부터)</div>
  ${emps.length?`
  <div class="tblwrap mt8">
    <table class="tbl">
      <thead><tr><th style="min-width:110px">직원</th>${["월","화","수","목","금","토","일"].map(d=>`<th class="c">${d}</th>`).join("")}</tr></thead>
      <tbody>${editRows}</tbody>

function leaveStat(e){
  const isH = e.emp==="주4";                        // 주4일: 시간 단위
  const m = monthsBetween(e.joinDate, todayStr());
  const yrs = Math.floor(m/12);
  /* 발생: 근속 1개월 경과 시마다 자동 +1 (1년 미만분 최대 11개) + 매 1년마다 15일(주4 12일) */
  let acc;
  if(isH) acc = num(Math.min(m,11)*H4_ACCRUE + yrs*ANNUAL_4DAY*H4_PER_DAY);
  else    acc = Math.min(m,11) + yrs*ANNUAL_FULL;
  const usedDays = DB.leaves.filter(l=>l.empId===e.id && l.status==="승인" && l.kind!=="기타")
    .reduce((s,l)=>s+Number(l.days||0),0);
  const used = isH ? num(usedDays*H4_PER_DAY) : usedDays;
  const adj  = DB.adjustments.filter(a=>a.empId===e.id).reduce((s,a)=>s+Number(a.amount||0),0);
  const rest = num(acc + adj - used);
  const u = isH ? "h" : "일";
  return {m,acc,used,adj:num(adj),rest,u,isH};
}
function nextAccrual(e){   // 다음 자동 발생 시점과 수량
  const m=monthsBetween(e.joinDate,todayStr()), isH=e.emp==="주4";
  const addM=n=>{ const d=new Date(e.joinDate+"T00:00:00"); d.setMonth(d.getMonth()+n);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  if(m<11) return {date:addM(m+1), amt:isH? num(H4_ACCRUE)+"h" : "1일"};
  const yrs=Math.floor(m/12);
  return {date:addM((yrs+1)*12), amt:isH? num(ANNUAL_4DAY*H4_PER_DAY)+"h" : ANNUAL_FULL+"일"};
}
function empTypeLabel(e){ return e.emp==="주5"?"주5일(정규)":e.emp==="주4"?"주4일(정규)":"파트타임"; }

  openModal(`
  <h3>${e?"직원 정보 수정":"입사 등록"}</h3>
  <div class="grid2">
    <div class="field"><label>이름</label><input id="st_name" value="${esc(e?.name||"")}"></div>
    <div class="field"><label>직무</label><select id="st_job" onchange="if(this.value==='파트약사')$('#st_emp').value='파트'">
      ${JOB_LIST.map(j=>`<option ${(e?.job||"정규약사")===j?"selected":""}>${j}</option>`).join("")}</select></div>
    <div class="field"><label>고용형태</label><select id="st_emp">
      <option value="주5" ${e?.emp==="주5"?"selected":""}>주5일(정규)</option>
      <option value="주4" ${e?.emp==="주4"?"selected":""}>주4일(정규)</option>
      <option value="파트" ${e?.emp==="파트"?"selected":""}>파트타임</option></select></div>
    <div class="field"><label>입사일</label><input type="date" id="st_join" value="${e?.joinDate||todayStr()}"></div>
    <div class="field"><label>퇴사일 (재직 중이면 비워두기)</label><input type="date" id="st_leave" value="${e?.leaveDate||""}"></div>
    <div class="field"><label>사번 ${e?"":"(비워두면 자동 부여)"}</label><input id="st_no" value="${esc(e?.no||"")}"></div>
  </div>
  <div class="foot">
    ${e?`<button class="btn danger" style="margin-right:auto" onclick="delStaff('${e.id}')">삭제</button>`:""}
    <button class="btn" onclick="closeModal()">취소</button>
    <button class="btn primary" onclick="saveStaff('${e?.id||""}')">저장</button>
  </div>`);
}
function saveStaff(id){
  const name=$("#st_name").value.trim(); if(!name){alert("이름을 입력하세요");return;}
  const job=$("#st_job").value, team=job==="일본팀"?"일본어":job==="중국팀"?"중국어":null;
  const emp=$("#st_emp").value, join=$("#st_join").value, leave=$("#st_leave").value||null;
  let no=$("#st_no").value.trim();
  const rec = id? empById(id) : {id:uid()};
  if(!no) no = id? rec.no : nextNo(JOB_OF({job,team}));
  Object.assign(rec,{name,job,team,emp,joinDate:join,leaveDate:leave,no});
  if(!id) DB.employees.push(rec);
  save(); closeModal(); render();
}
function delStaff(id){
  if(!confirm("직원을 완전히 삭제할까요?\n(근무·연차 기록도 함께 지워집니다. 퇴사자는 삭제 대신 퇴사일 입력을 권장)")) return;
  DB.employees=DB.employees.filter(e=>e.id!==id);
  DB.leaves=DB.leaves.filter(l=>l.empId!==id);
  DB.adjustments=DB.adjustments.filter(a=>a.empId!==id);
  Object.values(DB.attendance).forEach(mo=>Object.values(mo).forEach(j=>{ delete j.cells[id]; }));
  DB.patterns.forEach(p=>Object.values(p.assign||{}).forEach(j=>delete j[id]));
  save(); closeModal(); render();
}

/* ================================================================
   공지·이벤트
================================================================ */
function rNotice(){
  const all=DB.notices;
  const cnt=s=>all.filter(n=>n.status===s).length;
  const f=S.noticeFilter;
  let list = f==="전체"? all : all.filter(n=>n.status===f);
  list=[...list].sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  const kindTag=k=>`<span class="badge ${k==="증정"?"k-gift":k==="쿠폰"?"k-coupon":"k-etc"}">${k}</span>`;
  const stTag=s=>`<span class="badge ${s==="진행중"?"st-run":s==="준비중"?"st-prep":"st-done"}">${s}</span>`;

  const cards=list.map(n=>`
    <div class="notice-full">
      <span style="float:right" class="muted small">${n.always?"상시":esc((n.start||"")+" ~ "+(n.end||""))}</span>
      ${stTag(n.status)} ${kindTag(n.kind)} <b style="font-size:15px;margin-left:4px">${esc(n.title)}</b>
      <div class="desc">${esc(n.body)}</div>
      ${n.images&&n.images.length?`<div class="nimgs">${n.images.map(src=>`<img src="${src}" onclick="window.open(this.src)">`).join("")}</div>`:""}
      <div class="row mt8" style="gap:6px">
        ${n.status!=="마감"?`<button class="btn sm" onclick="noticeDone('${n.id}')">완료로 표시</button>`:`<button class="btn sm" onclick="noticeRun('${n.id}')">진행중으로 되돌리기</button>`}
        <button class="btn sm" onclick="openNoticeEdit('${n.id}')">수정</button>
        <button class="btn sm danger" onclick="delNotice('${n.id}')">삭제</button>
      </div>
    </div>`).join("");

  return `
  <div class="row" style="justify-content:space-between">
    <div><h1 class="page-title">공지·이벤트</h1>
    <div class="page-sub">본사에서 내려온 공지·이벤트를 수행상태로 관리합니다.</div></div>
    <button class="btn primary" onclick="openNoticeEdit()">＋ 새 공지/이벤트 등록</button>
  </div>
  <div class="pills mt14">
    ${["전체","진행중","마감","준비중"].map(s=>`<button class="${f===s?"on":""}" onclick="S.noticeFilter='${s}';render()">${s} ${s==="전체"?all.length:cnt(s)}</button>`).join("")}
  </div>
  ${cards||`<div class="empty mt14">등록된 공지·이벤트가 없습니다. <b>＋ 새 공지/이벤트 등록</b>으로 시작하세요.</div>`}`;
}
function noticeDone(id){ const n=DB.notices.find(x=>x.id===id); if(n){n.status="마감"; save(); render();} }
function noticeRun(id){ const n=DB.notices.find(x=>x.id===id); if(n){n.status="진행중"; save(); render();} }
function delNotice(id){ if(!confirm("이 공지·이벤트를 삭제할까요?")) return; DB.notices=DB.notices.filter(n=>n.id!==id); save(); render(); }
let _nImgs=[];
function openNoticeEdit(id){
  const n = id? DB.notices.find(x=>x.id===id) : null;
  _nImgs = n? [...(n.images||[])] : [];
  openModal(`
  <h3>${n?"공지·이벤트 수정":"새 공지/이벤트 등록"}</h3>
  <div class="grid2">
    <div class="field"><label>상태</label><select id="nt_st">
      ${["준비중","진행중","마감"].map(s=>`<option ${n?.status===s||(!n&&s==="진행중")?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="field"><label>종류</label><select id="nt_kind">
      ${["증정","쿠폰","기타"].map(k=>`<option ${n?.kind===k?"selected":""}>${k}</option>`).join("")}</select></div>
  </div>
  <div class="field"><label>제목</label><input id="nt_title" value="${esc(n?.title||"")}"></div>
  <div class="field"><label>내용</label><textarea id="nt_body" rows="5">${esc(n?.body||"")}</textarea></div>
  <div class="field"><label><input type="checkbox" id="nt_always" ${n?!n.always?"":"checked":"checked"} onchange="$('#nt_dates').style.display=this.checked?'none':'grid'"> 상시</label></div>
  <div class="grid2" id="nt_dates" style="display:${n&&!n.always?"grid":"none"}">
    <div class="field"><label>시작일</label><input type="date" id="nt_s" value="${n?.start||""}"></div>
    <div class="field"><label>종료일</label><input type="date" id="nt_e" value="${n?.end||""}"></div>
  </div>
  <div class="field"><label>이미지 첨부 (쿠폰·포스터 등)</label>
    <input type="file" id="nt_img" accept="image/*" multiple onchange="noticeImgAdd(this)">
    <div class="nimgs" id="nt_imgs">${_nImgs.map((s,i)=>`<span style="position:relative"><img src="${s}" style="max-height:90px"><button class="btn sm" style="position:absolute;top:2px;right:2px" onclick="noticeImgDel(${i})">×</button></span>`).join("")}</div>
  </div>
  <div class="foot"><button class="btn" onclick="closeModal()">취소</button>
  <button class="btn primary" onclick="saveNotice('${n?.id||""}')">저장</button></div>`,true);
}
function noticeImgAdd(input){
  [...input.files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ // 용량 절약을 위해 900px로 축소 저장
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,900/img.width);
        const cv=document.createElement("canvas");
        cv.width=img.width*sc; cv.height=img.height*sc;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        _nImgs.push(cv.toDataURL("image/jpeg",.82));
        $("#nt_imgs").innerHTML=_nImgs.map((s,i)=>`<span style="position:relative"><img src="${s}" style="max-height:90px"><button class="btn sm" style="position:absolute;top:2px;right:2px" onclick="noticeImgDel(${i})">×</button></span>`).join("");
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
  input.value="";
}
function noticeImgDel(i){
  _nImgs.splice(i,1);
  $("#nt_imgs").innerHTML=_nImgs.map((s,j)=>`<span style="position:relative"><img src="${s}" style="max-height:90px"><button class="btn sm" style="position:absolute;top:2px;right:2px" onclick="noticeImgDel(${j})">×</button></span>`).join("");
}
function saveNotice(id){
  const title=$("#nt_title").value.trim(); if(!title){alert("제목을 입력하세요");return;}
  const rec = id? DB.notices.find(x=>x.id===id) : {id:uid(),created:new Date().toISOString()};
  Object.assign(rec,{status:$("#nt_st").value,kind:$("#nt_kind").value,title,
    body:$("#nt_body").value.trim(),always:$("#nt_always").checked,
    start:$("#nt_s")?.value||"",end:$("#nt_e")?.value||"",images:_nImgs});
  if(!id) DB.notices.push(rec);
  try{ save(); }catch(e){ alert("저장 공간이 부족합니다. 이미지 수를 줄여주세요."); return; }
  closeModal(); render();
}

/* ================================================================
   백업
================================================================ */
function openBackup(){
  openModal(`
  <h3>백업</h3>
  <p class="muted small" style="margin-bottom:14px">데이터는 이 브라우저(localStorage)에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니, 주기적으로 파일로 내려받아 보관하세요.</p>
  <div class="row" style="gap:8px">
    <button class="btn primary" onclick="exportBackup()">📥 백업 파일 내려받기</button>
    <label class="btn">📤 백업 파일 불러오기<input type="file" accept=".json" style="display:none" onchange="importBackup(this)"></label>
  </div>
  <div class="foot"><button class="btn" onclick="closeModal()">닫기</button></div>`);
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="명동플래그쉽레디영_인사관리_백업_"+todayStr().replaceAll("-","")+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.employees && !data.attendance){ alert("올바른 백업 파일이 아닙니다."); return; }
      if(!confirm("현재 데이터를 백업 파일 내용으로 교체할까요?")) return;
      DB=data; load2(); save(); closeModal(); render();
    }catch(e){ alert("파일을 읽을 수 없습니다."); }
  };
  r.readAsText(f);
}
function load2(){ // import 후 누락 필드 보정
  if(!DB.shifts) DB.shifts=DEFAULT_SHIFTS();
  if(!DB.shiftsV5){ DB.shifts=DEFAULT_SHIFTS(); DB.shiftsV5=true; }
  if(!DB.shifts["물류"]) DB.shifts["물류"]=DEFAULT_SHIFTS()["물류"];
  ["employees","patterns","leaves","adjustments","todos","notices"].forEach(k=>{ if(!DB[k]) DB[k]= k==="patterns"?freshDB().patterns:[]; });
  if(!DB.attendance) DB.attendance={};
}

/* ================================================================
   시작
================================================================ */
function boot(){
  if(!role()){ $("#login").classList.remove("hidden"); $("#app").classList.add("hidden");
    setTimeout(()=>$("#loginPw").focus(),50); return; }
  load();
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  const chip=$("#roleChip");
  if(isAdmin()){ chip.textContent="관리자"; chip.classList.add("admin"); }
  else{ chip.textContent="연차·직원 편집 제한"; chip.classList.remove("admin"); }
  render();
}
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && document.activeElement===$("#loginPw")) doLogin(); });
boot();
</script>
